<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Fundo verde arredondado -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#15803D"/>
  <!-- Antena do robô -->
  <line x1="32" y1="10" x2="32" y2="17" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="32" cy="9" r="3.5" fill="#FFFFFF"/>
  <!-- Orelhas / Sensores laterais -->
  <rect x="9" y="27" width="5" height="12" rx="2.5" fill="#BBF7D0"/>
  <rect x="50" y="27" width="5" height="12" rx="2.5" fill="#BBF7D0"/>
  <!-- Cabeça do robô -->
  <rect x="14" y="17" width="36" height="30" rx="8" fill="#FFFFFF"/>
  <!-- Visor e olhos -->
  <rect x="19" y="23" width="26" height="12" rx="5" fill="#0F172A"/>
  <circle cx="26" cy="29" r="3" fill="#22C55E"/>
  <circle cx="38" cy="29" r="3" fill="#22C55E"/>
  <!-- Boca / Sorriso tecnológico -->
  <path d="M26 40 H38" stroke="#15803D" stroke-width="3" stroke-linecap="round"/>
</svg>
